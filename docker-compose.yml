services:
  # ── 1. Shivakriti Constructions Frontend Web Application ──
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shivakriti-frontend
    ports:
      - "8085:80"
    restart: unless-stopped
    depends_on:
      - backend

  # ── 2. Shivakriti Constructions Express Backend & Metrics API ──
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: shivakriti-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    restart: unless-stopped

  # ── 3. Host & Infrastructure Node Exporter ──
  node-exporter:
    image: prom/node-exporter:latest
    container_name: shivakriti-node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped

  # ── 4. Prometheus Time-Series Monitoring Engine ──
  prometheus:
    image: prom/prometheus:latest
    container_name: shivakriti-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    depends_on:
      - backend
      - node-exporter

  # ── 5. Grafana Visualization & Alerting Dashboards ──
  grafana:
    image: grafana/grafana:latest
    container_name: shivakriti-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    restart: unless-stopped
    depends_on:
      - prometheus
